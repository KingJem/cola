[project]
name = "cola"
version = "0.1.0"
description = "A high-performance async Python web scraping framework"
authors = [
    {name = "KingJem", email = "qqqqivy@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "aiohttp>=3.8.0",
    "lxml>=4.9.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "types-lxml>=2025.3.4",
]

[project.optional-dependencies]
redis = [
    "redis>=5.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]

[project.scripts]
cola = "src.commands.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
]
